<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>عارض الـ PDF الاحترافي - Ahmed Mousa</title>
    <!-- مكتبة PDF.js لتحويل صفحات الـ PDF إلى صور مطابقة للأصل 100% بدون أي أخطاء في الحروف -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* شريط التحكم العلوي */
        .viewer-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55%;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.95);
        }

        /* واجهة رفع الملف الافتراضية */
        .upload-container {
            margin-top: 60px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
        }

        .upload-card {
            background: #161b22;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            padding: 40px 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .upload-card:hover {
            border-color: #3b82f6;
        }

        .upload-card input {
            display: none;
        }

        /* حاوية عرض الصفحات كصور مترتبة تحت بعضها بسلاسة */
        #pdf-images-container {
            margin-top: 60px;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            gap: 15px;
            touch-action: pan-x pan-y pinch-zoom;
        }

        .pdf-page-img {
            width: 100%;
            max-width: 750px;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #ffffff;
        }

        /* شاشة التحميل والتجهيز المسبق */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: #fff;
            gap: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- شريط التحكم العلوي -->
    <div class="viewer-header">
        <div class="header-title" id="file-name-display">عارض المستندات المباشر</div>
        <div class="header-actions">
            <!-- زر الفتح في برنامج آخر على التليفون (📱) -->
            <button class="action-btn" id="open-external-btn" title="فتح في تطبيق آخر" onclick="openExternalApp()">📱</button>
            <!-- زر الإغلاق (❌) لتقفيل العرض والرجوع -->
            <button class="action-btn" onclick="closeViewer()" title="إغلاق الملف">❌</button>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-text">جاري معالجة الصفحات وعرضها بدقة...</span>
    </div>

    <!-- واجهة رفع الملف -->
    <div class="upload-container" id="upload-section">
        <label class="upload-card">
            <div style="font-size: 40px; margin-bottom: 12px;">📑</div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #e6edf3;">ارفع ملف الـ PDF للعرض المباشر</div>
            <div style="font-size: 13px; color: #8b949e;">يمنع تداخل الحروف ويعرض الصفحات تحت بعضها</div>
            <input type="file" id="pdf-file-input" accept="application/pdf" onchange="handleFileSelect(event)">
        </label>
    </div>

    <!-- منطقة عرض صفحات الـ PDF (كمعلومات بصرية مرسومة بدقة تامة) -->
    <div id="pdf-images-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // لو الصفحة مفتوحة جوه iframe من الموقع، شريط الموقع الأساسي أصلاً موجود فوق
        // فبنخفي شريط العارض ده عشان مايتكررش، والفتح المباشر (زي Gemini) يفضل زي ما هو بدون أي تغيير
        if (window.self !== window.top) {
            document.querySelector('.viewer-header').style.display = 'none';
            document.getElementById('upload-section').style.marginTop = '0';
            document.getElementById('pdf-images-container').style.marginTop = '0';
        }

        let currentPdfBlobUrl = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('file-name-display').innerText = file.name;
            currentPdfBlobUrl = URL.createObjectURL(file);

            const reader = new FileReader();
            reader.onload = function(e) {
                renderPdfAsImages(e.target.result);
            };
            reader.readAsArrayBuffer(file);
        }

        // هذه هي الدالة الأساسية التي تستطيع استخدامها لاحقاً لربط الملفات من موقعك
        async function renderPdfAsImages(dataArrayBuffer) {
            showLoading(true, "جاري تحضير الصفحات...");
            try {
                const loadingTask = pdfjsLib.getDocument({ data: dataArrayBuffer });
                const pdfDoc = await loadingTask.promise;
                
                document.getElementById('upload-section').style.display = 'none';
                const container = document.getElementById('pdf-images-container');
                container.style.display = 'flex';
                container.innerHTML = '';

                // تجهيز ورسم كل الصفحات مسبقاً وبشكل متسلسل
                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    
                    // دقة عالية جداً (Scale 2.5) لضمان وضوح الأرقام والجداول وعدم تغبيش الزوم
                    const viewport = page.getViewport({ scale: 2.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // تحويل الصفحة إلى صورة واضحة وثابتة (تحل تماماً مشكلة تداخل الحروف العربية)
                    const img = document.createElement('img');
                    img.className = 'pdf-page-img';
                    img.src = canvas.toDataURL('image/png');
                    container.appendChild(img);
                }
            } catch (error) {
                alert("حدث خطأ أثناء معالجة الملف: " + error.message);
            } finally {
                showLoading(false);
            }
        }

        // زر الفتح في برنامج آخر على التليفون
        function openExternalApp() {
            if (!currentPdfBlobUrl) {
                alert("الرجاء اختيار ملف PDF أولاً.");
                return;
            }
            const a = document.createElement('a');
            a.href = currentPdfBlobUrl;
            a.target = '_blank';
            a.download = document.getElementById('file-name-display').innerText || "document.pdf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // زر الإغلاق (❌) لتقفيل العرض والعودة للخلف
        function closeViewer() {
            document.getElementById('pdf-images-container').style.display = 'none';
            document.getElementById('upload-section').style.display = 'flex';
            document.getElementById('pdf-images-container').innerHTML = '';
            document.getElementById('file-name-display').innerText = 'عارض المستندات المباشر';
            currentPdfBlobUrl = null;
        }

        function showLoading(show, text = "") {
            const overlay = document.getElementById('loading-overlay');
            const txt = document.getElementById('loading-text');
            if (show) {
                txt.innerText = text;
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        // ===== الربط بالموقع: تحميل ملف PDF تلقائياً من رابط عبر ?url=...&name=... =====
        // هذا الجزء فقط هو المُضاف، وباقي الصفحة كما هي طبق الأصل من نسخة Gemini
        (async function loadPdfFromWebsite() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('url');
            const fileName = params.get('name') || 'ملف PDF';
            if (!fileUrl) return; // لو مفيش رابط، تفضل واجهة الرفع اليدوي شغالة زي ما هي

            // لما الصفحة بتتفتح من الموقع (فيها ?url=...)، زر الإغلاق (❌) يرجع لصفحة الموقع بدل ما يعرض واجهة الرفع الفاضية
            window.closeViewer = function () {
                if (window.history.length > 1) window.history.back();
                else window.close();
            };

            document.getElementById('file-name-display').innerText = fileName;
            document.getElementById('upload-section').style.display = 'none';
            currentPdfBlobUrl = fileUrl;

            try {
                showLoading(true, "جاري تحميل الملف من الموقع...");
                const response = await fetch(fileUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('تعذر تحميل ملف PDF من الموقع');
                const arrayBuffer = await response.arrayBuffer();
                await renderPdfAsImages(arrayBuffer);
            } catch (error) {
                showLoading(false);
                alert("حدث خطأ أثناء تحميل الملف من الموقع: " + error.message);
            }
        })();

        // ===== زوم بإصبعين عند فتح الملف جوه iframe من الموقع فقط =====
        // لما الصفحة تتفتح مباشرة (زي رفع الملف يدوي) البراوزر بيعمل الزووم الطبيعي بنفسه بدون أي كود هنا
        // لكن جوه iframe المتصفح بيتجاهل خاصية الزووم الطبيعية بتاعة الصفحة، فبنعوضها بكود بسيط لتكبير الصور فعلياً
        (function enableIframePinchZoom() {
            const isEmbedded = window.self !== window.top;
            if (!isEmbedded) return; // فتح مباشر: يفضل زي ما هو بدون أي تعديل، والزووم الطبيعي هو اللي بيشتغل

            const container = document.getElementById('pdf-images-container');
            let scale = 1, startDistance = 0, startScale = 1;
            let hadPinch = false; // بنتتبع هل الجيستشر ده كان فيه بينش أصلاً
            let lastTapTime = 0;

            function distance(t1, t2) {
                return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            }

            function applyScale() {
                container.querySelectorAll('.pdf-page-img').forEach(function (img) {
                    const baseWidth = Math.min(750, Math.max(container.clientWidth - 20, 260));
                    img.style.width = (baseWidth * scale) + 'px';
                    img.style.maxWidth = 'none';
                });
            }

            container.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    startDistance = distance(e.touches[0], e.touches[1]);
                    startScale = scale;
                    hadPinch = true; // ده بينش فعلي، مش تاب
                }
            }, { passive: true });

            container.addEventListener('touchmove', function (e) {
                if (e.touches.length !== 2 || !startDistance) return;
                e.preventDefault();
                const newDistance = distance(e.touches[0], e.touches[1]);
                scale = Math.min(3, Math.max(1, startScale * (newDistance / startDistance)));
                applyScale();
            }, { passive: false });

            // الزوم بيفضل زي ما هو بعد ما تشيل صوابعك (مطلوب مايتلغيش تلقائي)
            container.addEventListener('touchend', function (e) {
                if (e.touches.length < 2) startDistance = 0;

                if (e.touches.length === 0) {
                    // دبل تاب لإرجاع الحجم الطبيعي - بس لو كانت لمسة واحدة حقيقية، مش نتيجة رفع صباعين بينش
                    if (!hadPinch) {
                        const now = Date.now();
                        if (now - lastTapTime < 300) {
                            scale = 1;
                            applyScale();
                        }
                        lastTapTime = now;
                    }
                    hadPinch = false;
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
